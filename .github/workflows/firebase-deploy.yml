name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - claude/golpoai-website-clone-011CV59ETNzdTYb4hUnvgMMD
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  deploy:
    name: Build and Deploy to Firebase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clarityvid-ai

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install System Dependencies for Canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: 📦 Install Backend Dependencies
        working-directory: backend
        run: |
          if [ ! -f package-lock.json ]; then
            npm install
          else
            npm ci
          fi

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: |
          if [ ! -f package-lock.json ]; then
            npm install
          else
            npm ci
          fi

      - name: 🏗️ Build Frontend for Production
        working-directory: frontend
        run: npm run build
        env:
          CI: false

      - name: 🔑 Setup Firebase Service Account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-adminsdk.json
          export GOOGLE_APPLICATION_CREDENTIALS="firebase-adminsdk.json"

      - name: 🔥 Install Firebase Tools
        run: npm install -g firebase-tools

      - name: 🚀 Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-adminsdk.json
        run: |
          firebase deploy --project exodus-48741 --non-interactive

      - name: 🧹 Cleanup
        if: always()
        run: rm -f firebase-adminsdk.json

      - name: ✅ Deployment Summary
        run: |
          echo "🎉 Deployment Complete!"
          echo "📱 Frontend: https://exodus-48741.web.app"
          echo "⚡ Backend: https://exodus-48741.web.app/api"
          echo "🔐 Admin: https://exodus-48741.web.app/admin/login"
