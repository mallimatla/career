name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - claude/golpoai-website-clone-011CV59ETNzdTYb4hUnvgMMD
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to Firebase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clarityvid-ai

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            clarityvid-ai/backend/package-lock.json
            clarityvid-ai/frontend/package-lock.json

      - name: 📦 Cache Frontend Dependencies
        uses: actions/cache@v3
        with:
          path: clarityvid-ai/frontend/node_modules
          key: frontend-deps-${{ hashFiles('clarityvid-ai/frontend/package-lock.json') }}
          restore-keys: |
            frontend-deps-

      - name: 📦 Install Frontend Dependencies
        working-directory: clarityvid-ai/frontend
        run: npm ci --prefer-offline

      - name: 🏗️ Build Frontend for Production
        working-directory: clarityvid-ai/frontend
        run: npm run build
        env:
          CI: false

      - name: 🔑 Setup Firebase Service Account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-adminsdk.json

      - name: 🔥 Install Firebase Tools
        run: npm install -g firebase-tools

      - name: ⚙️ Create Backend Environment File
        working-directory: clarityvid-ai/backend
        run: |
          cat > .env << 'EOF'
          # Server Configuration
          NODE_ENV=production
          API_URL=https://exodus-48741.web.app/api
          FRONTEND_URL=https://exodus-48741.web.app

          # JWT Configuration
          JWT_SECRET=clarityvid-secure-jwt-secret-key-2024-production
          JWT_EXPIRE=7d

          # Rate Limiting
          RATE_LIMIT_WINDOW=15
          RATE_LIMIT_MAX_REQUESTS=100

          # Video Processing
          MAX_VIDEO_DURATION=60
          VIDEO_PROCESSING_TIMEOUT=900000

          # Logging
          LOG_LEVEL=info
          EOF

      - name: 🚀 Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-adminsdk.json
        run: |
          firebase deploy --project exodus-48741 --non-interactive --force

      - name: 🧹 Cleanup
        if: always()
        run: rm -f firebase-adminsdk.json

      - name: 🧪 Install E2E Test Dependencies
        working-directory: clarityvid-ai/e2e
        run: npm install

      - name: 🎭 Install Playwright Browsers
        working-directory: clarityvid-ai/e2e
        run: npx playwright install chromium --with-deps

      - name: 🧪 Run E2E Tests
        working-directory: clarityvid-ai/e2e
        run: npm test
        env:
          BASE_URL: https://exodus-48741.web.app

      - name: 📊 Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: clarityvid-ai/e2e/playwright-report/
          retention-days: 30

      - name: ✅ Deployment Summary
        run: |
          echo "🎉 Deployment Complete!"
          echo "📱 Frontend: https://exodus-48741.web.app"
          echo "⚡ Backend: https://exodus-48741.web.app/api"
          echo "✅ E2E Tests: Passed"
