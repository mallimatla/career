name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - claude/golpoai-website-clone-011CV59ETNzdTYb4hUnvgMMD
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  deploy:
    name: Build and Deploy to Firebase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clarityvid-ai

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install System Dependencies for Canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: 📦 Install Backend Dependencies
        working-directory: clarityvid-ai/backend
        run: npm install

      - name: 📦 Install Frontend Dependencies
        working-directory: clarityvid-ai/frontend
        run: npm ci

      - name: 🏗️ Build Frontend for Production
        working-directory: clarityvid-ai/frontend
        run: npm run build
        env:
          CI: false

      - name: 🔍 Verify Build Output
        working-directory: clarityvid-ai
        run: |
          echo "=== Checking build directory ==="
          ls -la frontend/build/ || echo "Build directory not found!"
          echo "=== Checking if index.html exists ==="
          ls -la frontend/build/index.html || echo "index.html not found!"
          echo "=== Current directory ==="
          pwd
          echo "=== Directory structure ==="
          ls -la

      - name: 🔑 Setup Firebase Service Account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-adminsdk.json
          export GOOGLE_APPLICATION_CREDENTIALS="firebase-adminsdk.json"

      - name: 🔥 Install Firebase Tools
        run: npm install -g firebase-tools

      - name: ⚙️ Create Backend Environment File
        working-directory: clarityvid-ai/backend
        run: |
          cat > .env << 'EOF'
          # Server Configuration
          NODE_ENV=production
          API_URL=https://exodus-48741.web.app/api
          FRONTEND_URL=https://exodus-48741.web.app

          # JWT Configuration
          JWT_SECRET=clarityvid-secure-jwt-secret-key-2024-production
          JWT_EXPIRE=7d

          # Rate Limiting
          RATE_LIMIT_WINDOW=15
          RATE_LIMIT_MAX_REQUESTS=100

          # Video Processing
          MAX_VIDEO_DURATION=60
          VIDEO_PROCESSING_TIMEOUT=900000

          # Logging
          LOG_LEVEL=info
          EOF

      - name: 🚀 Deploy Hosting First
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-adminsdk.json
        run: |
          firebase deploy --only hosting --project exodus-48741 --non-interactive

      - name: 🚀 Deploy Everything
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-adminsdk.json
        run: |
          firebase deploy --project exodus-48741 --non-interactive --force

      - name: 🧹 Cleanup
        if: always()
        run: rm -f firebase-adminsdk.json

      - name: ✅ Deployment Summary
        run: |
          echo "🎉 Deployment Complete!"
          echo "📱 Frontend: https://exodus-48741.web.app"
          echo "⚡ Backend: https://exodus-48741.web.app/api"
          echo "🔐 Admin: https://exodus-48741.web.app/admin/login"
