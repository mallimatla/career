name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - claude/golpoai-website-clone-011CV59ETNzdTYb4hUnvgMMD
    paths:
      - 'clarityvid-ai/backend/**'
      - 'clarityvid-ai/frontend/**'
      - 'clarityvid-ai/firestore.rules'
      - 'clarityvid-ai/storage.rules'
      - 'clarityvid-ai/firebase.json'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  deploy:
    name: Build and Deploy to Firebase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clarityvid-ai

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install Backend Dependencies
        working-directory: ./clarityvid-ai/backend
        run: npm ci

      - name: 📦 Install Frontend Dependencies
        working-directory: ./clarityvid-ai/frontend
        run: npm ci

      - name: 🏗️ Build Frontend for Production
        working-directory: ./clarityvid-ai/frontend
        run: npm run build
        env:
          CI: false

      - name: 🔑 Setup Firebase Service Account
        working-directory: ./clarityvid-ai
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-adminsdk.json
          export GOOGLE_APPLICATION_CREDENTIALS="firebase-adminsdk.json"

      - name: 🔥 Install Firebase Tools
        run: npm install -g firebase-tools

      - name: 🚀 Deploy to Firebase
        working-directory: ./clarityvid-ai
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-adminsdk.json
        run: |
          firebase deploy --project exodus-48741 --non-interactive

      - name: 🧹 Cleanup
        if: always()
        run: rm -f firebase-adminsdk.json

      - name: ✅ Deployment Summary
        run: |
          echo "🎉 Deployment Complete!"
          echo "📱 Frontend: https://exodus-48741.web.app"
          echo "⚡ Backend: https://exodus-48741.web.app/api"
          echo "🔐 Admin: https://exodus-48741.web.app/admin/login"
